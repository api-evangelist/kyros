aid: kyros
name: Kyros College Prep
description: 'Kyros (kyros.ai) is an AI-driven college preparation and admissions platform. In the company''s
  own words, it is "a College Prep Platform by former Googlers, Admissions Officers, and Professors" that
  "uses AI to offer 100K+ summer and financial aid programs." The product combines student assessments for
  college and major fit, one-on-one counseling, college essay and letter-of-recommendation support,
  extracurricular and summer-program discovery, and structured program tracks such as Future You Lab, the
  UC Bootcamp, and industry immersion and research programs. Kyros also sells through partner channels,
  with education-partner, VAR, counselor-advisory, college-success, and Fortune 1000 employer offerings,
  and publishes a large admissions blog. As of 2026-07-19 Kyros publishes no public API, developer portal,
  SDKs, or machine-readable API description.'
